<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>會員中心 — DOPA 台灣</title>
</head><body>
<style>
  /* A3 個人資料（會員中心）。各機能への分岐点。
     台湾では小羊卡牌社の件があるため「信頼の可視化」が差別化要因になる。
     運営情報・寄送追跡・點數の履歴をここから辿れるようにしている。 */
  :root{
    --bg1:#FFD233; --bg2:#FF9A1F;
    --red:#EC1E4E; --red-dark:#C4103A;
    --ink:#221A12; --sub:#8A8178; --line:#E6E1DA;
    --coin:#F5B920; --green:#1E7A4D; --amber:#A85D00;
    --safe: env(safe-area-inset-bottom, 0px);
    --tc:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Hiragino Sans",sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{font-family:var(--tc); color:var(--ink);
       background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 40%,var(--bg2) 100%);
       background-attachment:fixed; -webkit-font-smoothing:antialiased}
  #app{max-width:480px; margin:0 auto; padding-bottom:calc(76px + var(--safe))}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
  a{text-decoration:none; color:inherit}
  :focus-visible{outline:3px solid #1B7FE0; outline-offset:2px}

  .hd{position:sticky; top:0; z-index:50; background:#fff; height:52px; padding:0 14px;
      display:flex; align-items:center; box-shadow:0 1px 0 rgba(0,0,0,.08)}
  .hd .ttl{font-size:15px; font-weight:800}

  /* 残高 */
  .wallet{margin:12px; border-radius:14px; overflow:hidden; color:#fff;
          background:linear-gradient(135deg,#C4103A,#EC1E4E 55%,#FF6B2C);
          box-shadow:0 4px 16px rgba(160,20,50,.32)}
  .wallet .top{padding:16px 16px 13px; display:flex; align-items:flex-start; gap:10px}
  .wallet .who{flex:1; min-width:0}
  .wallet .who b{display:block; font-size:14px; font-weight:800}
  .wallet .who small{display:block; font-size:10.5px; opacity:.85; margin-top:2px}
  .wallet .lv{font-size:10px; font-weight:800; background:rgba(255,255,255,.22);
              border-radius:999px; padding:4px 10px; white-space:nowrap}
  .wallet .amt{padding:0 16px 15px; display:flex; align-items:baseline; gap:6px}
  .coin{width:22px; height:22px; border-radius:50%; align-self:center; flex:0 0 auto;
        background:radial-gradient(circle at 35% 30%,#FFE9A0,var(--coin) 60%,#C98A00)}
  .wallet .amt .v{font-size:34px; font-weight:900; line-height:1; font-variant-numeric:tabular-nums}
  .wallet .amt .u{font-size:13px; font-weight:800; opacity:.9}
  .wallet .acts{display:flex; border-top:1px solid rgba(255,255,255,.22)}
  .wallet .acts a{flex:1; padding:12px 6px; text-align:center; font-size:13px; font-weight:800}
  .wallet .acts a + a{border-left:1px solid rgba(255,255,255,.22)}

  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:0 12px}
  .stat{background:#fff; border-radius:11px; padding:13px 8px; text-align:center;
        box-shadow:0 2px 8px rgba(120,60,0,.16)}
  .stat .v{font-size:21px; font-weight:900; font-variant-numeric:tabular-nums; line-height:1.1}
  .stat .l{margin-top:4px; font-size:10.5px; font-weight:700; color:var(--sub)}
  .stat.warn .v{color:var(--amber)}

  .sec{background:#fff; margin:12px; border-radius:12px; overflow:hidden;
       box-shadow:0 2px 8px rgba(120,60,0,.16)}
  .sec h2{margin:0; padding:13px 14px 11px; font-size:12px; font-weight:800; color:var(--sub);
          letter-spacing:.05em; border-bottom:1px solid var(--line)}
  .menu a, .menu button{width:100%; display:flex; align-items:center; gap:11px;
        padding:14px; border-bottom:1px solid var(--line); text-align:left; font-size:14px}
  .menu a:last-child, .menu button:last-child{border-bottom:none}
  .menu .ic{width:32px; height:32px; flex:0 0 auto; border-radius:8px; background:#FBF6EA;
            display:grid; place-items:center; font-size:15px}
  .menu .tx{flex:1; min-width:0}
  .menu .tx b{display:block; font-weight:700; font-size:14px}
  .menu .tx small{display:block; font-size:10.5px; color:var(--sub); margin-top:2px; line-height:1.5}
  .menu .n{font-size:11.5px; font-weight:800; color:var(--sub); font-variant-numeric:tabular-nums;
           background:#F6F2EA; border-radius:999px; padding:3px 9px}
  .menu .arw{color:#C9C1B6; flex:0 0 auto}
  .menu .danger b{color:var(--red)}

  /* 信頼の可視化 */
  .trust{margin:12px; padding:14px; border-radius:12px;
         background:rgba(255,255,255,.78); border:1px solid rgba(255,255,255,.95)}
  .trust h3{margin:0 0 8px; font-size:12px; font-weight:800; color:#7A3D00}
  .trust dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:11.5px}
  .trust dt{color:#8A6A30; font-weight:700}
  .trust dd{margin:0; font-weight:700; color:#4A3512}
  .trust p{margin:9px 0 0; font-size:10.5px; line-height:1.7; color:#6B4A16}

  .tabbar{position:fixed; left:50%; transform:translateX(-50%); bottom:0; z-index:60;
          width:100%; max-width:480px; background:#fff; border-top:1px solid var(--line);
          display:grid; grid-template-columns:repeat(4,1fr); padding-bottom:var(--safe)}
  .tabbar a{padding:7px 0 8px; display:flex; flex-direction:column; align-items:center; gap:3px;
            font-size:10.5px; font-weight:700; color:var(--sub)}
  .tabbar a.on{color:var(--red)}
  .tabbar svg{width:21px; height:21px}

  #toast{position:fixed; left:50%; bottom:calc(88px + var(--safe));
         transform:translateX(-50%) translateY(8px);
         background:rgba(20,14,8,.92); color:#fff; font-size:13px; font-weight:700;
         padding:10px 18px; border-radius:999px; z-index:100; max-width:88%; text-align:center;
         opacity:0; pointer-events:none; transition:opacity .22s, transform .22s}
  #toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
</style>

<div id="app">
  <header class="hd"><span class="ttl">會員中心</span></header>

  <section class="wallet">
    <div class="top">
      <div class="who">
        <b id="uname">—</b>
        <small id="uid">—</small>
      </div>
      <span class="lv" id="ulv">—</span>
    </div>
    <div class="amt">
      <span class="coin"></span>
      <span class="v" id="bal">0</span><span class="u">PT</span>
    </div>
    <div class="acts">
      <a href="./b1.html">購買點數</a>
      <a href="./app.html">前往抽卡</a>
    </div>
  </section>

  <div class="stats" id="stats"></div>

  <section class="sec">
    <h2>卡片</h2>
    <div class="menu" id="mCards"></div>
  </section>

  <section class="sec">
    <h2>紀錄</h2>
    <div class="menu" id="mLogs"></div>
  </section>

  <section class="sec">
    <h2>帳戶</h2>
    <div class="menu" id="mAcc"></div>
  </section>

  <div class="trust">
    <h3>營運資訊</h3>
    <dl>
      <dt>營運公司</dt><dd id="coName">（登記後填入）</dd>
      <dt>統一編號</dt><dd id="coNo">（登記後填入）</dd>
      <dt>客服</dt><dd id="coMail">（開設後填入）</dd>
    </dl>
    <p>
      點數僅能用於本服務內，<b>不提供任何形式的現金兌換</b>。
      中獎機率依法揭露於各卡包頁面。
    </p>
  </div>
</div>

<nav class="tabbar">
  <a href="./app.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg>抽卡列表</a>
  <a href="./app.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round"><path d="M4 6h10v12H4z M14 9h6v9h-6z"/></svg>快報</a>
  <a href="./cards.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>我的卡片</a>
  <a href="./mypage.html" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zM4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>會員中心</a>
</nav>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  const fmt = n => n.toLocaleString("zh-Hant");

  const USER = {
    name: "王小明",
    id: "u_8f2a41",
    level: "白銀會員",
    balance: 1200,
    cardsHeld: 16,
    shipping: 1,           // 寄送申請中
    drawsTotal: 128
  };

  $("#uname").textContent = USER.name;
  $("#uid").textContent   = "ID " + USER.id;
  $("#ulv").textContent   = USER.level;
  $("#bal").textContent   = fmt(USER.balance);

  $("#stats").innerHTML = [
    { v: USER.cardsHeld,  l: "持有卡片" },
    { v: USER.shipping,   l: "寄送中", warn: USER.shipping > 0 },
    { v: USER.drawsTotal, l: "累計抽卡" }
  ].map(s => `<div class="stat${s.warn ? " warn" : ""}">
      <div class="v">${fmt(s.v)}</div><div class="l">${s.l}</div></div>`).join("");

  const ARW = `<svg class="arw" width="17" height="17" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
    ><path d="M9 18l6-6-6-6"/></svg>`;

  function row(m){
    const tag = m.href ? "a" : "button";
    const attr = m.href ? ` href="${m.href}"` : ` data-act="${m.act || ""}"`;
    return `<${tag}${attr}${m.danger ? ' class="danger"' : ""}>
      <span class="ic">${m.icon}</span>
      <span class="tx"><b>${m.title}</b>${m.desc ? `<small>${m.desc}</small>` : ""}</span>
      ${m.n != null ? `<span class="n">${fmt(m.n)}</span>` : ""}
      ${ARW}</${tag}>`;
  }

  $("#mCards").innerHTML = [
    { icon:"🃏", title:"我的卡片", desc:"轉換點數・申請寄送", href:"./cards.html", n:USER.cardsHeld },
    { icon:"📦", title:"寄送狀態", desc:"追蹤號碼與配送進度", act:"ship", n:USER.shipping }
  ].map(row).join("");

  $("#mLogs").innerHTML = [
    { icon:"🪙", title:"點數紀錄", desc:"每一筆增減都可查看", href:"./logs.html?v=ledger" },
    { icon:"🎯", title:"抽卡紀錄", desc:"抽卡結果與當時的機率版本", href:"./logs.html?v=draws" },
    { icon:"🧾", title:"購買紀錄", desc:"付款方式與發票", href:"./logs.html?v=payments" }
  ].map(row).join("");

  $("#mAcc").innerHTML = [
    { icon:"👤", title:"個人資料", act:"profile" },
    { icon:"📍", title:"收件地址", desc:"寄送時使用", act:"address" },
    { icon:"🔔", title:"通知設定", act:"notify" },
    { icon:"📄", title:"服務條款・隱私權政策", act:"terms" },
    { icon:"🚪", title:"登出", act:"logout", danger:true }
  ].map(row).join("");

  document.addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    if (b.dataset.act === "logout") { location.href = "./auth.html"; return; }
    toast("此頁面尚未建置（原型）");
  });

  let tid = 0;
  function toast(msg){
    const el = $("#toast");
    el.textContent = msg; el.classList.add("on");
    clearTimeout(tid); tid = setTimeout(() => el.classList.remove("on"), 2000);
  }
})();
</script>
</body></html>
